name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated version tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    uses: wodby/services/.github/workflows/tag-release.yml@master
    with:
      tag: ${{ inputs.tag || github.ref_name }}

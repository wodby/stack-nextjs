name: nextjs
icon: nextjs
docs: https://wodby.com/docs/2.0/stacks/catalog/nextjs/
title: Next.js

services:
- name: nextjs
  title: Node.js
  service: nextjs
  required: true
  links:
  - name: db
    service: postgres
  - name: redis
    service: valkey
  - name: sendmail
    service: mailpit
  - name: otel
    service: otel-collector

- name: postgres
  disabled: true
  title: PostgreSQL
  required: false
  service: postgres
  volumes:
  - name: data
    size: 10   

- name: valkey
  disabled: true
  title: Valkey
  service: valkey

- name: mailpit
  disabled: true
  title: Mailpit
  service: mailpit

- name: opensmtpd
  disabled: true
  title: OpenSMTPD
  service: opensmtpd

- name: gotenberg
  required: false
  disabled: true
  title: Gotenberg
  service: gotenberg

- name: otel-collector
  title: OpenTelemetry Collector
  service: opentelemetry-collector
  disabled: true
  # The application sends telemetry to the Collector inside the environment only.
  endpoints:
  - name: otlp
    ports:
    - name: otlp-http
      private: true
  workloads:
  - name: main
    containers:
    - name: otelcol
      resources:
        request:
          cpu: 100
          memory: 128
        limit:
          cpu: 500
          memory: 512

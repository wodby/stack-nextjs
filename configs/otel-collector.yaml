# OpenTelemetry Collector for this application. The application sends OTLP to it inside the environment, and the
# Collector forwards traces, metrics and logs to the service's "Upstream OTLP endpoint" setting.
# Reference: https://opentelemetry.io/docs/collector/configuration/
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  # The application's otel link sends "Authorization: Bearer <ingest token>".
  bearertokenauth:
    token: ${env:OTLP_INGEST_TOKEN}

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        auth:
          authenticator: bearertokenauth
      http:
        endpoint: 0.0.0.0:4318
        auth:
          authenticator: bearertokenauth

processors:
  # Refuse data before the container runs out of memory.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  batch: {}

exporters:
  # OTLP over HTTP. The exporter appends /v1/traces, /v1/metrics and /v1/logs to the endpoint.
  otlp_http/upstream:
    endpoint: ${env:OTLP_UPSTREAM_ENDPOINT}
    headers:
      Authorization: ${env:OTLP_UPSTREAM_AUTHORIZATION}

service:
  extensions: [health_check, bearertokenauth]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/upstream]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/upstream]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/upstream]
